spring.application.name=streamflow-app-be

# Database (use env DATABASE_URL or individual vars; do not commit real credentials)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (use validate when using Flyway migrations in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================
# Kafka (Confluent Cloud)
# ================
spring.kafka.bootstrap-servers=pkc-921jm.us-east-2.aws.confluent.cloud:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=streamflow-group-1
spring.kafka.consumer.auto-offset-reset=earliest

# Confluent Cloud security (SASL_SSL) - set KAFKA_JAAS_USER and KAFKA_JAAS_PASSWORD in env
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_JAAS_USER:}" password="${KAFKA_JAAS_PASSWORD:}";
spring.kafka.properties.ssl.endpoint.identification.algorithm=https
spring.kafka.properties.session.timeout.ms=45000

# ================
# AWS S3 (images / videos upload)
# ================
# Set streamflow.aws.s3.enabled=true and streamflow.aws.s3.bucket to use S3.
# Credentials: set access-key-id/secret-access-key here, or use IAM/instance profile / env AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
streamflow.aws.s3.enabled=false
streamflow.aws.s3.bucket="streamflow-netflix-demo"
streamflow.aws.s3.region=us-east-1
# Optional: for LocalStack or custom endpoint
# streamflow.aws.s3.endpoint-override=http://localhost:4566
# Optional: explicit credentials - use env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or set here (do not commit real keys)
streamflow.aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
streamflow.aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Path-style access (e.g. for LocalStack)
streamflow.aws.s3.path-style-access=false
# Key prefixes for uploads
streamflow.aws.s3.images-prefix=images/
streamflow.aws.s3.videos-prefix=videos/
# Max upload size in MB (default 512)
streamflow.aws.s3.max-file-size-mb=512

# Ingestion: presigned URL validity in minutes (default 15)
streamflow.ingestion.presigned-url-expiration-minutes=15

# Playback / DRM foundation: license TTL and signed URL validity
streamflow.playback.license-ttl-minutes=60
streamflow.playback.signed-url-expiration-minutes=10

# Common (analytics, watch progress) - override in tests via application-test.properties
streamflow.common.default-top-videos=10
streamflow.common.max-analytics-page=500
streamflow.common.completion-threshold-seconds=60
streamflow.common.continue-watching-days=30
streamflow.common.continue-watching-limit=50