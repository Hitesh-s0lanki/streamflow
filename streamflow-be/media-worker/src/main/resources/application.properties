spring.application.name=streamflow-media-worker

# No web server
spring.main.web-application-type=none

# Database (same as API - shared DB for job and asset updates)
spring.datasource.url=${STREAMFLOW_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${STREAMFLOW_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${STREAMFLOW_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AWS (raw bucket = source; packaged bucket = output)
app.aws.region=${AWS_REGION:us-east-1}
app.aws.raw-bucket=${STREAMFLOW_RAW_BUCKET:}
app.aws.packaged-bucket=${STREAMFLOW_PACKAGED_BUCKET:}

# Kafka consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=streamflow-media-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Worker
app.worker.temp-dir=${WORKER_TEMP_DIR:${java.io.tmpdir}}
app.worker.ingestion-topic=${STREAMFLOW_INGESTION_TOPIC:streamflow.ingestion.jobs}
app.worker.sprite-interval-seconds=5
app.worker.sprite-thumb-width=160
app.worker.sprite-thumb-height=90
app.worker.ffmpeg-timeout-seconds=3600
