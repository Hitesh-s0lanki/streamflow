spring.application.name=streamflow-be

# SSE / async timeout: must be longer than longest upload (e.g. 10 min for large files)
streamflow.demo.sse-timeout-ms=600000
spring.mvc.async.request-timeout=610000

# Database — set via env (GitHub Secrets / .env): SPRING_DATASOURCE_URL, USERNAME, PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — tuned for Neon serverless Postgres
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# AWS S3 — set via env (GitHub Secrets / .env): STREAMFLOW_AWS_S3_* and credentials
streamflow.aws.s3.enabled=${STREAMFLOW_AWS_S3_ENABLED:true}
streamflow.aws.s3.region=${STREAMFLOW_AWS_S3_REGION:us-east-1}
streamflow.aws.s3.bucket=${STREAMFLOW_AWS_S3_BUCKET:}
streamflow.aws.s3.access-key-id=${STREAMFLOW_AWS_S3_ACCESS_KEY_ID:}
streamflow.aws.s3.secret-access-key=${STREAMFLOW_AWS_S3_SECRET_ACCESS_KEY:}
streamflow.aws.s3.endpoint-override=${STREAMFLOW_AWS_S3_ENDPOINT_OVERRIDE:}
streamflow.aws.s3.path-style-access=${STREAMFLOW_AWS_S3_PATH_STYLE_ACCESS:false}
streamflow.aws.s3.max-file-size-mb=2048
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
streamflow.aws.s3.images-prefix=images/
streamflow.aws.s3.videos-prefix=videos/
streamflow.aws.s3.sprites-prefix=sprites/
streamflow.aws.s3.large-file-threshold-mb=100

# API base URL — set via env STREAMFLOW_API_BASE_URL (optional; for stream proxy)
streamflow.api.base-url=${STREAMFLOW_API_BASE_URL:}

# Playback session — pre-signed URL expiration
streamflow.playback.manifest-url-expiry-minutes=30
streamflow.playback.sprite-url-expiry-minutes=60
streamflow.playback.asset-url-expiry-minutes=60

# HLS transcoding
streamflow.hls.segment-duration=10

# Sprite sheet generation
streamflow.sprite.interval-seconds=10
streamflow.sprite.thumb-width=160
streamflow.sprite.thumb-height=90
streamflow.sprite.max-total-frames=100000
streamflow.sprite.frames-per-sheet=100
streamflow.sprite.columns=10

# All above env vars: add to GitHub Secrets and to Render (or host) env; see .env.example.
