spring.application.name=streamflow

# Database
spring.datasource.url=jdbc:postgresql://ep-wild-forest-ahdqk8z6-pooler.c-3.us-east-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_BRm3Qbwi6Djt&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_BRm3Qbwi6Djt
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (use validate when using Flyway migrations in production)
spring.jpa.hibernate.ddl-auto=update

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AWS (override with env or profile-specific properties)
app.aws.region=us-east-1
app.aws.raw-bucket=""
app.aws.packaged-bucket=""
app.aws.presigned-upload-expiry-minutes=15
# app.aws.endpoint-override=http://localhost:4566

# Kafka – event producer (Confluent / Spring Boot setup)
# Set spring.kafka.bootstrap-servers to enable; omit or leave empty to disable ingestion events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
# Confluent Cloud (optional): SASL/SSL – uncomment and set env vars if using Confluent Cloud
# spring.kafka.properties.sasl.mechanism=PLAIN
# spring.kafka.properties.security.protocol=SASL_SSL
# spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";
# Local / plain Kafka (e.g. localhost:9092)
# spring.kafka.bootstrap-servers=localhost:9092

# Producer – ingestion job events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# App-specific topic (consumer uses same topic in media-worker)
app.kafka.ingestion-topic=streamflow.ingestion.jobs
