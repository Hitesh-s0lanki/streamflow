spring.application.name=streamflow-be
# Listen on PORT when set (e.g. Render), else 8080 for local
server.port=${PORT:8080}

# SSE / async timeout: must be longer than longest upload (e.g. 10 min for large files)
# If shorter than upload time, the stream closes and the frontend stops receiving events.
streamflow.demo.sse-timeout-ms=600000
spring.mvc.async.request-timeout=610000

# Database: use env vars (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# On Render, DATABASE_URL (postgres://...) is supported and mapped automatically.
# Local default for development when env is not set:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/streamflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — tuned for Neon serverless Postgres (strict idle-in-transaction timeout)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# AWS S3 Configuration
streamflow.aws.s3.enabled=true
streamflow.aws.s3.path-style-access=false
streamflow.aws.s3.max-file-size-mb=2048
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
streamflow.aws.s3.images-prefix=images/
streamflow.aws.s3.videos-prefix=videos/
streamflow.aws.s3.sprites-prefix=sprites/
streamflow.aws.s3.large-file-threshold-mb=100

# API base URL (e.g. http://localhost:8080). When set, playback uses stream proxy so
# variant playlists and segments are served via this API (fixes 403 on S3 relative URLs).
# streamflow.api.base-url=http://localhost:8080

# Playback session — pre-signed URL expiration
streamflow.playback.manifest-url-expiry-minutes=30
streamflow.playback.sprite-url-expiry-minutes=60
streamflow.playback.asset-url-expiry-minutes=60

# HLS transcoding
streamflow.hls.segment-duration=10

# Sprite sheet generation (timeline hover preview, multiple sheets per video)
streamflow.sprite.interval-seconds=10
streamflow.sprite.thumb-width=160
streamflow.sprite.thumb-height=90
streamflow.sprite.max-total-frames=100000
streamflow.sprite.frames-per-sheet=100
streamflow.sprite.columns=10

# AWS S3 Region and Credentials (set via env / .env: STREAMFLOW_AWS_S3_ACCESS_KEY_ID, STREAMFLOW_AWS_S3_SECRET_ACCESS_KEY)
streamflow.aws.s3.region=${STREAMFLOW_AWS_S3_REGION:ap-south-1}
streamflow.aws.s3.bucket=${STREAMFLOW_AWS_S3_BUCKET:}
streamflow.aws.s3.access-key-id=${STREAMFLOW_AWS_S3_ACCESS_KEY_ID:}
streamflow.aws.s3.secret-access-key=${STREAMFLOW_AWS_S3_SECRET_ACCESS_KEY:}

streamflow.api.base-url=http://localhost:8080


streamflow.cors.allowed-origins=${STREAMFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}