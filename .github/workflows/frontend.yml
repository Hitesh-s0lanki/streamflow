name: Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - 'streamflow-fe/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'streamflow-fe/**'

defaults:
  run:
    working-directory: streamflow-fe

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: dummy-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: streamflow-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
